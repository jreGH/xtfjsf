[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xtfjsf"
version = "0.1.0"
description = "Read, process and mosaic side-scan and synthetic aperture sonar data (XTF, JSF, ...)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
images = ["pillow>=9"]
test = ["pytest>=7", "pillow>=9"]

[project.scripts]
xtfjsf = "xtfjsf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
